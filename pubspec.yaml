name: proyecto_chifacentro
description: "App Android de mesas y pedidos para los mozos de Chifa Centro."
# La siguiente línea evita publicar accidentalmente el paquete en
# pub.dev con `flutter pub publish`. Se recomienda para paquetes privados.
publish_to: 'none' # Elimina esta línea si deseas publicar en pub.dev.

# A continuación se definen la versión y el número de compilación de la aplicación.
# La versión contiene tres números separados por puntos, por ejemplo 1.2.43,
# seguidos de un número de compilación opcional separado por el signo +.
# La versión y el número de compilación se pueden cambiar al ejecutar flutter
# build con las opciones --build-name y --build-number, respectivamente.
# En Android, build-name corresponde a versionName y build-number a versionCode.
# Más información sobre versiones en Android: https://developer.android.com/studio/publish/versioning
# En iOS, build-name corresponde a CFBundleShortVersionString y build-number a CFBundleVersion.
# Más información sobre versiones en iOS:
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# En Windows, build-name define las partes principal, secundaria y de revisión
# de la versión; build-number se utiliza como sufijo de compilación.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Las dependencias indican los paquetes que necesita la aplicación.
# Para actualizar automáticamente las dependencias a sus últimas versiones,
# puedes ejecutar `flutter pub upgrade --major-versions`. También puedes
# actualizarlas manualmente cambiando las versiones indicadas a continuación
# por las disponibles en pub.dev. Para consultar las dependencias
# con versiones más recientes, ejecuta `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  # El paquete "flutter_lints" incluye reglas de estilo recomendadas para
  # seguir buenas prácticas de programación. Estas reglas se activan
  # en el archivo `analysis_options.yaml`, ubicado en la raíz del
  # proyecto. Consulta ese archivo para desactivar reglas concretas
  # o activar reglas adicionales.
  flutter_lints: ^6.0.0

# Para consultar la configuración general de Dart de este archivo, visita
# la página https://dart.dev/tools/pub/pubspec

# La siguiente sección contiene la configuración específica de Flutter.
flutter:

  # La siguiente línea incluye la fuente de iconos de Material
  # en la aplicación para poder utilizar los iconos de
  # la clase Icons.
  uses-material-design: true

  # Para añadir imágenes y otros recursos, declara una sección assets como esta:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # Una imagen puede tener variantes para distintas resoluciones. Consulta
  # https://flutter.dev/to/resolution-aware-images

  # Para añadir recursos incluidos en otras dependencias, consulta
  # https://flutter.dev/to/asset-from-package

  # Para añadir fuentes personalizadas, declara una sección fonts
  # dentro de esta sección "flutter". Cada entrada debe incluir
  # una clave "family" con el nombre de la familia y una clave "fonts"
  # con los archivos y las características de cada fuente.
  # Ejemplo:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # Para utilizar fuentes incluidas en otras dependencias,
  # consulta https://flutter.dev/to/font-from-package
