# Este archivo configura el analizador estático de Dart para detectar
# errores, advertencias y problemas de estilo.
#
# Los problemas detectados aparecen en los editores compatibles con Dart
# (https://dart.dev/tools#ides-and-editors). También puedes ejecutar
# el análisis desde la terminal con `flutter analyze`.

# La siguiente línea activa las reglas de estilo recomendadas para aplicaciones,
# paquetes y complementos de Flutter, siguiendo buenas prácticas de programación.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - macos/**
    - linux/**

linter:
  # Las reglas de estilo de este proyecto se pueden personalizar en la
  # sección siguiente para desactivar reglas de `package:flutter_lints/flutter.yaml`
  # o activar reglas adicionales. La lista de reglas disponibles
  # y su documentación se encuentran en https://dart.dev/lints.
  #
  # También puedes desactivar una regla para una línea o un archivo,
  # sin desactivarla para todo el proyecto. Para ello utiliza
  # la instrucción `// ignore: name_of_lint` para una línea,
  # o `// ignore_for_file: name_of_lint` para el archivo
  # donde se detecta el problema de estilo.
  rules:
    # avoid_print: false  # Descomenta para desactivar la regla `avoid_print`.
    # prefer_single_quotes: true  # Descomenta para activar la regla `prefer_single_quotes`.

# Puedes encontrar más información sobre este archivo en
# https://dart.dev/guides/language/analysis-options
